# Checks every push and pull request. A push to main deploys production
# (Railway + Vercel), so main should only receive commits that pass here.
# Tests never call real services: no secrets are configured for this workflow.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIRROR_DISCOVERY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/requirements-ci.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Python packages
        run: pip install -r .github/workflows/requirements-ci.txt
      - name: pytest suites
        working-directory: manhwa-recap-v1/review_ui
        run: grep -l "^def test_" test_*.py | xargs python -m pytest -q -p no:cacheprovider
      - name: Script suites
        working-directory: manhwa-recap-v1/review_ui
        run: |
          set -e
          for t in test_assign test_board_data test_crop_preview test_crop_score \
                   test_fast_render test_hardening test_pacing test_render_epoch \
                   test_storyboard_edit test_undo test_usage_carry test_validator \
                   test_validator_actions test_lab_ready test_pipeline_strip test_render_queue; do
            echo "::group::$t"
            python "$t.py" | tail -3
            echo "::endgroup::"
          done
        shell: bash -o pipefail {0}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: manhwa-recap-v1/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: manhwa-recap-v1/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build
